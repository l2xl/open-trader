name: Build clang-23 CI image

on:
  push:
    branches: [main]
    paths:
      - ci/docker/clang23/Dockerfile
      - .github/workflows/build-clang-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/clang23-build
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ci/docker/clang23
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print pinned digest
        run: |
          echo "Pin the build job to:"
          echo "ghcr.io/${{ github.repository }}/clang23-build@${{ steps.build.outputs.digest }}"
