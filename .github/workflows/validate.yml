name: Validate

on:
  push:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check IPRL v2 license headers
        run: python3 scripts/check_license.py --check

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: read
    # Built by .github/workflows/build-clang-image.yml from ci/docker/clang23/Dockerfile
    # and published to GHCR, so this job doesn't depend on apt.llvm.org's clang-23
    # feed (an unreleased-version nightly build that disappears without notice)
    # being up at every CI run. Pinned by digest, not the mutable :latest tag;
    # re-pin here after any build-clang-image.yml run that changes the Dockerfile.
    container:
      image: ghcr.io/l2xl/open-trader/clang23-build@sha256:02f5decc38cfdcc9db8590c66a0d43de88ab348f3790007d47e25125a27aaa68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: build-ci
          key: build-ci-clang23-ninja-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: build-ci-clang23-ninja-

      - name: Configure (CMake)
        # -Wunused-template suppression for oneTBB (vendored, not our code)
        # lives in the clang23-build image's clang++-23 wrapper, not here:
        # TBB's own -Wall -Wextra -Werror is appended after CMAKE_CXX_FLAGS
        # on the command line, so a flag passed from this step can't win.
        run: >
          cmake -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23

      # CPM already fetched AI-Scratcher's source into build-ci/_deps/ai_scratcher-src during
      # configure, above, as a side effect of the main CMakeLists.txt's include(cmake/AiScratcher.cmake)
      # (the sole place it is ever fetched from). Passing that source on as a build artifact lets the
      # syngate job install it locally, with no second network fetch and no need to configure the
      # standalone cmake/ai_scratcher/CMakeLists.txt project there.
      - name: Upload AI-Scratcher source
        uses: actions/upload-artifact@v6
        with:
          name: ai-scratcher-source
          path: build-ci/_deps/ai_scratcher-src
          retention-days: 1

      - name: Build unit tests
        # Container jobs default run steps to `sh`, not `bash` (unlike jobs
        # on the bare runner), and `set -o pipefail` is a bash-ism.
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-ci --target unit_tests --parallel 2>&1 | tee build-ci/build.log
      - name: Report build failure as a Check Run
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/report_build_failure.py build-ci/build.log

      # The Check Run can only carry an excerpt (the Checks API caps a summary at
      # 65535 characters), and raw job logs need repo-admin auth to download, so
      # the untruncated log travels as an artifact anyone with repo access can pull.
      - name: Upload build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-log-build
          path: build-ci/build.log
          if-no-files-found: warn
          retention-days: 14

      # Jobs run on fresh runners: the built tree travels between jobs as a tarball
      # artifact (tar preserves the executable bits that upload-artifact strips).
      - name: Pack built tree
        run: >
          tar --zstd -cf build-tree.tar.zst
          --exclude=CMakeFiles --exclude='*-src' --exclude='*-subbuild' build-ci

      - name: Upload built tree
        uses: actions/upload-artifact@v6
        with:
          name: build-tree
          path: build-tree.tar.zst
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    # Explicit condition on build's result: without it a skipped job anywhere
    # up the chain (e.g. a conditional entry check) skips this job too, and
    # syngate then dies downloading the ctest-results artifact that was
    # never uploaded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      checks: write
      actions: write
      packages: read
    # The build job runs in a container, where GitHub Actions mounts the
    # workspace at /__w/... instead of the bare runner's /home/runner/work/...;
    # CMake bakes that absolute path into CTestTestfile.cmake. Running this
    # job in a container too (same image, so no extra pull) keeps the
    # unpacked tree's path matching what ctest expects.
    container:
      image: ghcr.io/l2xl/open-trader/clang23-build@sha256:02f5decc38cfdcc9db8590c66a0d43de88ab348f3790007d47e25125a27aaa68
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Download built tree
        uses: actions/download-artifact@v7
        with:
          name: build-tree

      - name: Unpack built tree
        run: tar --zstd -xf build-tree.tar.zst

      # build-tree is only needed by this job; delete it now instead of
      # waiting out the retention-days TTL. Uses the REST API directly
      # rather than the gh CLI, which isn't installed in this container.
      - name: Delete build-tree artifact
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_URL: https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          ARTIFACT_BASE_URL: https://api.github.com/repos/${{ github.repository }}/actions/artifacts
        run: |
          ARTIFACT_ID=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$ARTIFACTS_URL" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((str(a['id']) for a in d['artifacts'] if a['name']=='build-tree'), ''))")
          if [ -n "$ARTIFACT_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$ARTIFACT_BASE_URL/$ARTIFACT_ID"
          fi

      # This image already has the project's toolchain deps (Boost, OpenSSL)
      # from the build job's install; no separate runtime-only install needed.

      - name: Run unit tests (ctest, offline)
        # Container jobs default run steps to `sh`, not `bash`; `set -o
        # pipefail` needs bash (see the build job's Configure step).
        shell: bash
        env:
          SYNGATE_COVERAGE_FILE: ${{ github.workspace }}/build-ci/syngate_coverage.jsonl
        run: |
          set -o pipefail
          ctest --test-dir build-ci -LE live --output-on-failure 2>&1 | tee build-ci/ctest.log
      - name: Report test failure as a Check Run
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/report_build_failure.py build-ci/ctest.log

      - name: Upload ctest log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-log-ctest
          path: build-ci/ctest.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload C++ coverage records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: syngate-coverage-cpp
          path: build-ci/syngate_coverage.jsonl
          if-no-files-found: warn

  syngate:
    runs-on: ubuntu-latest
    needs: [build, test]
    # Runs even when the test job failed so failed items are published red;
    # skipped only when there is nothing to roll up (build failed or run cancelled).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The build job already fetched AI-Scratcher's source once (cmake/AiScratcher.cmake, the
      # sole place it is ever installed from); this job installs from that same source rather than
      # fetching it again or configuring the standalone cmake/ai_scratcher project.
      - name: Download AI-Scratcher source
        uses: actions/download-artifact@v7
        with:
          name: ai-scratcher-source
          path: ai-scratcher-source

      - name: Resolve AI-Scratcher interpreter
        run: |
          echo "AI_SCRATCHER_SOURCE_DIR=$PWD/ai-scratcher-source" >> "$GITHUB_ENV"
          export AI_SCRATCHER_SOURCE_DIR="$PWD/ai-scratcher-source"
          echo "AI_SCRATCHER_PY=$(bash ci/venv.sh)" >> "$GITHUB_ENV"

      # Two-commit re-approval discipline over the commits this push brought in. Merge commits
      # are exempt by construction (check_self_approval enumerates the range with
      # `git rev-list --no-merges`), so pushes of merges pass without a job-level skip.
      - name: Check two-step item re-approval
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="$(git merge-base origin/main HEAD)..HEAD"
          fi
          "$AI_SCRATCHER_PY" scripts/check_self_approval.py "$RANGE"

      # Single source of truth for syngate validation: ci/gate.sh resolves the interpreter above
      # and runs `syngate validate` (structural + frozen-routine checks) through it.
      #
      # The gate's verdict decides whether this job is red -- it must not decide
      # whether the run gets a syngate report at all. A red gate is exactly
      # when the tree is most worth reading, so every step below runs on
      # `!cancelled()` rather than on this step's outcome, and the gate's output
      # is teed into syngate_validate.log so the report itself carries the reason.
      - name: Validate syngate tree
        id: validate
        shell: bash
        run: |
          set -o pipefail
          bash ci/gate.sh 2>&1 | tee -a syngate_validate.log

      - name: Install actionlint
        if: ${{ !cancelled() }}
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/

      # Open Trader's own scripts/tests (workflow-config structure checks) need only pytest and
      # PyYAML, never AI-Scratcher, so this runs on the plain system interpreter setup-python gave
      # us above, not the AI-Scratcher venv.
      - name: Run syngate tooling tests (pytest)
        if: ${{ !cancelled() }}
        env:
          SYNGATE_COVERAGE_FILE: ${{ github.workspace }}/pytest-coverage.jsonl
        run: |
          pip install --quiet pytest pyyaml
          python -m pytest scripts/tests

      # continue-on-error, not a hard dependency: when the test job died before
      # uploading, the report is still rendered from whatever coverage exists.
      - name: Download C++ coverage records
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: syngate-coverage-cpp
          path: build-ci

      - name: Check coverage against the tree
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          bash ci/gate.sh --coverage pytest-coverage.jsonl --coverage build-ci/syngate_coverage.jsonl 2>&1 | tee -a syngate_validate.log

      - name: Compute recursive syngate status
        if: ${{ !cancelled() }}
        run: >
          "$AI_SCRATCHER_PY" scripts/syngate.py report
          --coverage pytest-coverage.jsonl
          --coverage build-ci/syngate_coverage.jsonl
          --out syngate_status.json

      - name: Write syngate report to the job summary
        if: ${{ !cancelled() }}
        run: >
          "$AI_SCRATCHER_PY" ci/write_status_summary.py
          --validation syngate_validate.log

      - name: Publish syngate tree as a Check Run
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          "$AI_SCRATCHER_PY" scripts/publish_check_run.py --status syngate_status.json
          --validation syngate_validate.log
