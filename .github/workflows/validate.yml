name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check IPRL v2 license headers
        run: python3 scripts/check_license.py --check

  # Two-step re-approval discipline. Runs on every event: merge commits are
  # exempt by construction (a merge carries the change and the review stamp
  # together), and check_self_approval.py enumerates the range with
  # `git rev-list --no-merges`, so merges to main — or to any branch — pass
  # without a job-level skip. Skipping the job here would poison the chain:
  # GitHub propagates a skipped job through `needs` transitively.
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check two-step requirement re-approval
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            RANGE="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="$(git merge-base origin/main HEAD)..HEAD"
          fi
          python3 scripts/check_self_approval.py "$RANGE"

  build:
    runs-on: ubuntu-latest
    needs: [license, approval]
    # Every downstream job states its own condition on the actual results of
    # its needs instead of relying on implicit skip propagation. Tolerating
    # 'skipped' keeps the chain alive if an entry check ever becomes
    # conditional again; any failure still stops build-test-requirements.
    if: ${{ !cancelled() && needs.license.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.approval.result) }}
    permissions:
      contents: read
      checks: write
      packages: read
    # Built by .github/workflows/build-clang-image.yml from ci/docker/clang23/Dockerfile
    # and published to GHCR, so this job doesn't depend on apt.llvm.org's clang-23
    # feed (an unreleased-version nightly build that disappears without notice)
    # being up at every CI run. Pinned by digest, not the mutable :latest tag;
    # re-pin here after any build-clang-image.yml run that changes the Dockerfile.
    container:
      image: ghcr.io/l2xl/open-trader/clang23-build@sha256:adfef0386b8d6a55d0b169918cfaceb674b3296d4c123612fd416a297e80e6bc
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: build-ci
          key: build-ci-clang23-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: build-ci-clang23-

      - name: Configure (CMake)
        # -Wunused-template suppression for oneTBB (vendored, not our code)
        # lives in the clang23-build image's clang++-23 wrapper, not here:
        # TBB's own -Wall -Wextra -Werror is appended after CMAKE_CXX_FLAGS
        # on the command line, so a flag passed from this step can't win.
        run: >
          cmake -B build-ci -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23

      - name: Build unit tests
        # Container jobs default run steps to `sh`, not `bash` (unlike jobs
        # on the bare runner), and `set -o pipefail` is a bash-ism.
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-ci --target unit_tests --parallel 2>&1 | tee build-ci/build.log
      - name: Report build failure as a Check Run
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/report_build_failure.py build-ci/build.log

      # Jobs run on fresh runners: the built tree travels between jobs as a tarball
      # artifact (tar preserves the executable bits that upload-artifact strips).
      - name: Pack built tree
        run: >
          tar --zstd -cf build-tree.tar.zst
          --exclude=CMakeFiles --exclude='*-src' --exclude='*-subbuild' build-ci

      - name: Upload built tree
        uses: actions/upload-artifact@v6
        with:
          name: build-tree
          path: build-tree.tar.zst
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    # Explicit condition on build's result: without it a skipped job anywhere
    # up the chain (e.g. a conditional entry check) skips this job too, and
    # requirements then dies downloading the ctest-results artifact that was
    # never uploaded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      checks: write
      actions: write
      packages: read
    # The build job runs in a container, where GitHub Actions mounts the
    # workspace at /__w/... instead of the bare runner's /home/runner/work/...;
    # CMake bakes that absolute path into CTestTestfile.cmake. Running this
    # job in a container too (same image, so no extra pull) keeps the
    # unpacked tree's path matching what ctest expects.
    container:
      image: ghcr.io/l2xl/open-trader/clang23-build@sha256:adfef0386b8d6a55d0b169918cfaceb674b3296d4c123612fd416a297e80e6bc
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Download built tree
        uses: actions/download-artifact@v7
        with:
          name: build-tree

      - name: Unpack built tree
        run: tar --zstd -xf build-tree.tar.zst

      # build-tree is only needed by this job; delete it now instead of
      # waiting out the retention-days TTL. Uses the REST API directly
      # rather than the gh CLI, which isn't installed in this container.
      - name: Delete build-tree artifact
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_URL: https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          ARTIFACT_BASE_URL: https://api.github.com/repos/${{ github.repository }}/actions/artifacts
        run: |
          ARTIFACT_ID=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$ARTIFACTS_URL" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((str(a['id']) for a in d['artifacts'] if a['name']=='build-tree'), ''))")
          if [ -n "$ARTIFACT_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$ARTIFACT_BASE_URL/$ARTIFACT_ID"
          fi

      # This image already has the project's toolchain deps (Boost, OpenSSL)
      # from the build job's install; no separate runtime-only install needed.

      - name: Run unit tests (ctest, offline)
        # Container jobs default run steps to `sh`, not `bash`; `set -o
        # pipefail` needs bash (see the build job's Configure step).
        shell: bash
        env:
          REQ_COVERAGE_FILE: ${{ github.workspace }}/build-ci/req_coverage.jsonl
        run: |
          set -o pipefail
          ctest --test-dir build-ci -LE live --output-on-failure 2>&1 | tee build-ci/ctest.log
      - name: Report test failure as a Check Run
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/report_build_failure.py build-ci/ctest.log

      - name: Upload C++ coverage records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: req-coverage-cpp
          path: build-ci/req_coverage.jsonl
          if-no-files-found: warn

  requirements:
    runs-on: ubuntu-latest
    needs: [build, test]
    # Runs even when the test job failed so failed requirements are published red;
    # skipped only when there is nothing to roll up (build failed or run cancelled).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Single source of truth for requirements validation: ci/gate.sh bootstraps
      # .venv-req and runs `req validate` (structural + frozen-routine checks).
      - name: Validate requirements
        id: validate
        run: bash ci/gate.sh

      - name: Install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/
      - name: Run requirements tooling tests (pytest)
        env:
          REQ_COVERAGE_FILE: ${{ github.workspace }}/pytest-coverage.jsonl
        run: .venv-req/bin/python -m pytest scripts/tests

      - name: Download C++ coverage records
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: req-coverage-cpp
          path: build-ci

      - name: Check coverage against the tree
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: >
          bash ci/gate.sh
          --coverage pytest-coverage.jsonl
          --coverage build-ci/req_coverage.jsonl

      - name: Compute recursive requirement status
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: >
          .venv-req/bin/python scripts/req.py report
          --coverage pytest-coverage.jsonl
          --coverage build-ci/req_coverage.jsonl
          --out req_status.json

      - name: Write requirements report to the job summary
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: .venv-req/bin/python ci/write_status_summary.py

      - name: Publish requirements tree as a Check Run
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv-req/bin/python scripts/publish_check_run.py --status req_status.json
