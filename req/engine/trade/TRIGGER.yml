header: Trigger & signal evaluation
description: |
  Order triggers as first-class, composable objects generalizing the existing data_condition
  predicate idiom from entity fields to indicator values. Pluggable evaluator strategies: boolean
  (crossover/threshold, Freqtrade/Hummingbot-compatible), computational geometry (trendline
  half-plane breaks, support/resistance zone containment, pattern fitting) and linear/quadratic
  programming (sized allocation and execution decisions). See
  req/trading_api_design_2026-08-30.md section 3.2.
parents: [TRADE]
order: 20
