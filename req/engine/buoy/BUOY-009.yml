header: Mean side classification
description: |
  The active period's trades shall be retained as a volume-by-price profile and each price level's side
  membership re-derived against the current volume-weighted mean whenever the
  per-side deviations are computed — at accumulation boundaries and at period
  close. A trade's side is never frozen against the running mean at ingestion
  time, per src/engine/BUOY_CANDLE.md section 3.
