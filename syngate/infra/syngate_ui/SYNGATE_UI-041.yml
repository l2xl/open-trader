header: Common status label
description: |
  Every place that shows an item shall label it with the summarized test status dot (gray, green or red), the ID and the review mark (green check, red cross, omitted while not reviewed), in this order.
  The status dot color
  - Gray - no tests and not reviewed
  - Green - tests passed and reviewed
  - Red - tests failed or review violated
